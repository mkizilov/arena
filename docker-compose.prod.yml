x-arena: &arena
  image: arena-local:turn15
  build:
    context: .
    dockerfile: Dockerfile
  environment: &arena-env
    DATABASE_URL: ${ARENA_DATABASE_URL:?set the Compose PostgreSQL URL}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set a project-local secret}
    RELEASE_COOKIE: ${ARENA_CLUSTER_COOKIE:?set a project-local distribution cookie}
    RELEASE_DISTRIBUTION: name
    ARENA_CLUSTER_STRATEGY: dns
    ARENA_CLUSTER_DNS: arena-node
    ARENA_NODE_BASENAME: arena
    ARENA_CLUSTER_EXPECTED_NODES: "2"
    ARENA_CONTAINER_HTTP: "1"
    ERL_EPMD_PORT: "22351"
    ERL_AFLAGS: "+S 2:2 -kernel inet_dist_listen_min 22352 inet_dist_listen_max 22359"
    PHX_SERVER: "1"
    PORT: "22300"
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:22300/readyz"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 20s
  networks:
    default:
      aliases: [arena-node]

services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ARENA_DB_PASSWORD:?set a project-local database password}
      POSTGRES_DB: arena_prod
    ports: ["127.0.0.1:22301:5432"]
    volumes: ["./.data/postgres-prod:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arena_prod"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: arena-local:turn15
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *arena-env
      RELEASE_DISTRIBUTION: none
    command: ["eval", "Arena.Release.migrate()"]
    depends_on:
      postgres:
        condition: service_healthy

  app1:
    <<: *arena
  app2:
    <<: *arena

  nginx:
    image: nginx:1.27.5-alpine
    ports: ["127.0.0.1:22300:22300"]
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
